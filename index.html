<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bancos del Perú</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Custom scrollbar for better aesthetics */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f1f1; 
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1; 
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8; 
    }
  </style>
  <!-- Config de es-module-shims (DEBE ir ANTES de cargar es-module-shims.js) -->
  <script type="esms-options">{"shimMode":true}</script>
  <!-- Necesario para ejecutar scripts `type="module-shim"` y cargar un importmap externo -->
  <script src="es-module-shims.js"></script>
  <!-- Importmap generado por Native Federation (sale en dist/importmap.json) -->
  <script type="importmap-shim" src="importmap.json"></script>
</head>
<body class="bg-slate-50 text-slate-900 h-screen overflow-hidden">
  <app-bank-mfe></app-bank-mfe>

  <!-- Standalone (sin Shell): carga el módulo expuesto ./Bootstrap desde remoteEntry.json -->
  <script type="module-shim">
    (async () => {
      try {
        const res = await fetch('./remoteEntry.json', { cache: 'no-store' });
        if (!res.ok) throw new Error(`No se pudo cargar remoteEntry.json (${res.status})`);
        const entry = await res.json();
        const expose = (entry?.exposes ?? []).find((e) => e?.key === './Bootstrap');
        if (!expose?.outFileName) throw new Error('No existe ./Bootstrap en remoteEntry.json');
        const importer = globalThis.importShim ?? ((p) => import(p));
        await importer('./' + expose.outFileName);
      } catch (err) {
        console.error('[standalone] Error cargando ./Bootstrap', err);
      }
    })();
  </script>
</body>
</html>
